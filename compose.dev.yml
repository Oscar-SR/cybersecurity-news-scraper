services:
  gateway:
    image: nginx:alpine
    container_name: gateway-dev
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ./infra/nginx-gateway/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile.dev
    container_name: backend-dev
    env_file:
      - ./.env
    volumes:
      - .:/app:cached
      - backend_node_modules:/app/node_modules
      - backend_pkg_node_modules:/app/packages/backend/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile.dev
    container_name: frontend-dev
    env_file:
      - ./.env
    environment:
      - FRONTEND_PORT=5173
    volumes:
      - frontend_node_modules:/app/node_modules
      - frontend_pkg_node_modules:/app/packages/frontend/node_modules
      - ./packages/frontend:/app/packages/frontend
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  backend_node_modules:
  backend_pkg_node_modules:
  frontend_node_modules:
  frontend_pkg_node_modules:

networks:
  app-network:
    driver: bridge
