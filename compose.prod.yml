services:
  reverse-proxy:
    image: caddy:2.9-alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - EMAIL=${EMAIL:-admin@localhost}
    volumes:
      - ./infra/reverse-proxy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "64M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/oscar-sr/cybersecurity-news-scraper/backend:${IMAGE_TAG:-latest}
    container_name: backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/oscar-sr/cybersecurity-news-scraper/frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
